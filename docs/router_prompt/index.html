<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Inferno Router &lt;Prompt&gt; back button repro</title>
	<style>
		* {
			box-sizing: border-box;
		}
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #f4f4f6;
			color: #202124;
			font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
			-webkit-text-size-adjust: 100%;
		}
		#app, .app {
			height: 100%;
		}
		.app {
			display: flex;
			flex-direction: column;
			max-width: 900px;
			margin: 0 auto;
			background: #fff;
		}
		header {
			padding: 12px 16px 8px;
			border-bottom: 1px solid #ddd;
		}
		h1 {
			margin: 0 0 8px;
			font-size: 18px;
		}
		h2 {
			margin: 0 0 8px;
			font-size: 17px;
		}
		main {
			flex: 1 1 auto;
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
		}
		.page {
			padding: 12px 16px;
		}
		.page p, .page ol {
			margin: 0 0 10px;
		}
		.page ol {
			padding-left: 22px;
		}
		code {
			font-family: Menlo, Consolas, monospace;
			font-size: 13px;
			background: #eceff4;
			padding: 1px 4px;
			border-radius: 3px;
			word-break: break-word;
		}
		.nav {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
		}
		.nav a {
			flex: 1 1 auto;
			text-align: center;
			padding: 10px 8px;
			border: 1px solid #c8ccd4;
			border-radius: 6px;
			background: #f7f8fa;
			color: #14487f;
			font-size: 14px;
			text-decoration: none;
		}
		.nav a:active {
			background: #e4e8ef;
		}
		.status {
			display: flex;
			flex-wrap: wrap;
			gap: 4px 14px;
			margin-top: 8px;
			font-family: Menlo, Consolas, monospace;
			font-size: 12px;
			color: #5b6068;
		}
		.status b {
			color: #202124;
		}
		.toggle {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 10px;
			padding: 8px 10px;
			border: 1px solid #c8ccd4;
			border-radius: 6px;
		}
		.toggle input {
			width: 20px;
			height: 20px;
		}
		.dialog {
			margin: 12px 0;
			padding: 12px;
			border: 1px solid #d8a300;
			border-radius: 6px;
			background: #fff8e1;
		}
		.dialog p {
			margin: 0 0 10px;
		}
		footer {
			flex: 0 0 auto;
			border-top: 1px solid #ddd;
			background: #fafafa;
			padding-bottom: env(safe-area-inset-bottom);
		}
		.controls {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			padding: 8px 16px;
		}
		button {
			flex: 1 1 auto;
			padding: 10px 8px;
			border: 1px solid #c8ccd4;
			border-radius: 6px;
			background: #fff;
			color: #202124;
			font-size: 14px;
		}
		button:active {
			background: #e4e8ef;
		}
		.log {
			height: 38vh;
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
			margin: 0 16px 12px;
			padding: 8px;
			border: 1px solid #ddd;
			border-radius: 6px;
			background: #14181f;
			color: #d8dee9;
			font-family: Menlo, Consolas, monospace;
			font-size: 11px;
			line-height: 1.5;
		}
		.entry {
			display: flex;
			gap: 6px;
			padding: 1px 0;
			word-break: break-word;
		}
		.time {
			flex: 0 0 auto;
			color: #667080;
			white-space: pre;
		}
		.kind {
			flex: 0 0 62px;
			color: #7fa7d4;
		}
		.text {
			flex: 1 1 auto;
		}
		.entry-popstate .kind, .entry-popstate .text {
			color: #7fd4a7;
		}
		.entry-confirm .kind, .entry-confirm .text {
			color: #e8c46a;
		}
		.entry-blocker .kind, .entry-blocker .text {
			color: #e8a06a;
		}
		.entry-diagnosis, .entry-ok {
			margin: 4px 0;
			padding: 4px;
			border-left: 3px solid #e05252;
			background: #24191c;
		}
		.entry-diagnosis .kind, .entry-diagnosis .text {
			color: #ff8f8f;
			font-weight: bold;
		}
		.entry-ok {
			border-left-color: #52a373;
			background: #16211b;
		}
		.entry-ok .kind, .entry-ok .text {
			color: #8fe0ac;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<div id="app"></div>
	<script src="dist/bundle.js"></script>
</body>
</html>

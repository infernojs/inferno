packages:
  - packages/*
  - fixtures/*
  - demo/*

linkWorkspacePackages: true
sharedWorkspaceLockfile: true
strictPeerDependencies: false

overrides:
  webdriver: 9.27.0
  webdriverio: 9.27.0

allowBuilds:
  '@parcel/watcher@2.5.6': true
  # Unpinned: parcel and the root devDependency drag in several @swc/core versions
  '@swc/core': true
  edgedriver@6.3.0: true
  # esbuild fetches its platform binary on install (tsx)
  esbuild: true
  geckodriver@6.1.0: true
  lmdb@2.8.5: true
  msgpackr-extract@3.0.3: true
  unrs-resolver@1.12.2: true
